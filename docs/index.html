<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noor Uddin - CV</title>
  <meta name="description" content="Noor Uddin CV - AI/ML Engineer and Software Engineer">
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5b6773;
      --line: #d8dee6;
      --accent: #1d4ed8;
      --bg: #f6f8fb;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    header {
      padding: 22px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: var(--panel);
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }

    a.button.primary {
      color: #ffffff;
      background: var(--accent);
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 24px 24px;
    }

    .pdf-frame {
      width: 100%;
      height: calc(100vh - 132px);
      min-height: 620px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .fallback {
      display: none;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    @media (max-width: 720px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
        justify-content: stretch;
      }

      a.button {
        flex: 1 1 150px;
      }

      .pdf-frame {
        height: 72vh;
        min-height: 500px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Noor Uddin</h1>
        <p>AI/ML Engineer | Software Engineer</p>
      </div>
      <nav class="actions" aria-label="CV actions">
        <a class="button primary" href="Nooruddin_CV.pdf" download>Download CV</a>
        <a class="button" href="Nooruddin_CV.pdf">Open PDF</a>
      </nav>
    </div>
  </header>

  <main>
    <object class="pdf-frame" data="Nooruddin_CV.pdf" type="application/pdf">
      <div class="fallback">
        <p>Your browser could not display the PDF inline.</p>
        <p><a href="Nooruddin_CV.pdf" download>Download Nooruddin_CV.pdf</a></p>
      </div>
    </object>
  </main>
</body>
</html>
